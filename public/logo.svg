<?xml version="1.0" encoding="UTF-8"?>
<!--
  Jarvis Studios monogram — clean vector redraw, closing docs/DESIGN.md §10.
  Three polygons, transparent background. Replaces the ~250KB auto-traced
  conversion of the original JPEG, which carried a baked-in black rectangle
  and ~240 near-duplicate anti-aliasing fragments.

  This standalone file is the on-dark mark: the "J" ships white, which is how
  a brand asset is normally consumed. In the app the mark is inlined by
  components/ui/Logo.tsx with the "J" on currentColor instead, so it follows
  the light/dark theme. Per DESIGN.md §2.1, never swap which letterform is
  neutral and which is blue — that split is the mark's signature.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285.06 214.44" role="img" aria-label="Jarvis Studios">
  <polygon fill="#00ADEF" points="285.06 75.65 285.06 0 155.72 0 155.72 101.36 156.77 101.85 156.77 102.25 232.01 138.62 232.01 173.44 155.72 138.79 155.72 214.44 285.06 214.44 285.06 113.08 284 112.59 284 112.19 208.77 75.83 208.77 41.01 285.06 75.65"/>
  <g fill="#ffffff">
    <polygon points="90.33 171.81 53.05 171.81 53.05 150.23 0 150.23 0 171.81 0 214.36 0 214.44 53.05 214.44 53.05 214.36 90.33 214.36 90.33 214.44 143.38 214.44 143.38 214.36 143.38 171.81 143.38 107.22 90.33 107.22 90.33 171.81"/>
    <polygon points="90.33 0 34.39 0 34.39 42.56 90.33 42.56 90.33 64.67 143.38 64.67 143.38 42.56 143.38 0 90.33 0"/>
  </g>
</svg>
